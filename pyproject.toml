[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecapa-age-gender"
version = "0.1.0"
description = "Joint age-bucket and gender classification from speech using a partially fine-tuned ECAPA-TDNN speaker embedder."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "speechbrain>=1.0",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
train = [
    "datasets>=2.19",
    "soundfile>=0.12",
    "pandas>=2.0",
    "tqdm>=4.66",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["ecapa_age_gender*"]
