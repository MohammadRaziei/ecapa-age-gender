# ---------------------------------------------------------------------------
# AgeGenderNet configuration
# ---------------------------------------------------------------------------

data:
  hf_dataset: "mozilla-foundation/common_voice_17_0"
  language: "en"                       # any Common Voice language code
  raw_dir: "training/data/raw"                  # where download_data.py saves HF Arrow datasets
  manifest_dir: "training/data/manifests"       # where prepare_data.py saves filtered CSV manifests
  label_map_path: "training/data/manifests/label_maps.json"
  sample_rate: 16000
  max_audio_seconds: 6.0               # clips are cropped/padded to this length for batching
  min_audio_seconds: 1.0               # shorter clips are dropped
  genders: ["male", "female"]          # classes kept (Common Voice also has "other", excluded by default)
  age_buckets:                          # Common Voice's own decade buckets, in class-index order
    - "teens"
    - "twenties"
    - "thirties"
    - "forties"
    - "fifties"
    - "sixties"
    - "seventies"
    - "eighties"
    - "nineties"

model:
  pretrained_source: "speechbrain/spkrec-ecapa-voxceleb"
  freeze_num_blocks: 2                 # how many of the first SE-Res2Net blocks to freeze (out of ~3-4)
  freeze_frontend: true                # freeze the mel-filterbank / input norm frontend
  embedding_dim: 192                   # ECAPA-TDNN output dim for this checkpoint
  head_hidden_dim: 128
  head_dropout: 0.2
  use_embedding_consistency_loss: false   # optional regularizer, see idea.md section 3.6
  consistency_loss_weight: 0.1

train:
  batch_size: 16
  num_workers: 4
  epochs: 15
  lr: 1.0e-4
  head_lr_multiplier: 5.0             # heads train faster than the fine-tuned backbone layers
  weight_decay: 1.0e-5
  gender_loss_weight: 1.0
  age_loss_weight: 1.0
  grad_clip_norm: 5.0
  log_every_n_steps: 20
  checkpoint_dir: "training/checkpoints"
  seed: 42
  device: "auto"                       # "auto" | "cuda" | "cpu"

eval:
  batch_size: 16
  checkpoint_path: "training/checkpoints/best_model.pt"
